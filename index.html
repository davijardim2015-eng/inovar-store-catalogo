function useCatalogo() {
  const [produtos, setProdutos] = useState([]);
  const [whatsappLoja, setWhatsappLoja] = useState('');
  const [faixasDesconto, setFaixasDesconto] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const [prodRes, cfgRes] = await Promise.all([
          supabaseClient.from('produtos').select('*').eq('ativo', true),
          supabaseClient.from('config').select('*').eq('chave', 'geral'),
        ]);
        if (prodRes.error) throw prodRes.error;
        const lista = (prodRes.data || []).filter(p => p.tipo === 'servico' || num(p.estoque_atual) > 0);
        setProdutos(lista);
        const cfgRow = (cfgRes.data || [])[0];
        if (cfgRow && cfgRow.valor && cfgRow.valor.whatsappLoja) setWhatsappLoja(cfgRow.valor.whatsappLoja);
        if (cfgRow && cfgRow.valor && Array.isArray(cfgRow.valor.faixasDesconto)) setFaixasDesconto(cfgRow.valor.faixasDesconto);
      } catch (e) {
        console.error('Erro ao carregar catálogo:', e);
        setErro('Não foi possível carregar os produtos agora. Tente novamente em instantes.');
      } finally {
        setCarregando(false);
      }
    })();
  }, []);

  return { produtos, whatsappLoja, faixasDesconto, carregando, erro };
}

  const [imgErro, setImgErro] = useState(false);
  return (
    <div className="bg-white rounded-2xl overflow-hidden shadow-sm flex flex-col">
      {p.imagem_url && !imgErro
        ? <img src={p.imagem_url} alt={p.nome} onError={() => setImgErro(true)} className="w-full h-28 sm:h-36 object-cover" />
        : <div className="w-full h-28 sm:h-36 bg-slate-100 flex items-center justify-center text-slate-300 text-2xl"><i className="fa-solid fa-image"></i></div>}
      <div className="p-3 flex flex-col flex-1">
        {p.categoria && <span className="text-[10px] uppercase tracking-wide text-navy2/70 font-semibold">{ehServico ? `Serviço • ${p.categoria}` : p.categoria}</span>}
        <h3 className="font-display font-bold text-navy text-sm leading-snug mt-0.5 line-clamp-2">{p.nome}</h3>
        <div className="mt-auto pt-2 flex items-center justify-between gap-2">
          <span className="font-display font-extrabold text-navy2 text-base">{fmtMoney(p.preco_venda)}</span>
          <button onClick={() => onAdd(p)} className="bg-lime hover:bg-limedk text-navy text-xs font-bold px-3 py-1.5 rounded-full whitespace-nowrap">
            <i className="fa-solid fa-plus mr-1"></i>Adicionar
          </button>
        </div>
      </div>
    </div>
  );
}

function CarrinhoDrawer({ itens, onQtd, onFechar, onConcluir, whatsappLoja, faixasDesconto }) {
  const [etapa, setEtapa] = useState('itens'); // itens | checkout
  const [nome, setNome] = useState('');
  const [telefone, setTelefone] = useState('');
  const [endereco, setEndereco] = useState('');
  const [pagamento, setPagamento] = useState('Pix');
  const [aviso, setAviso] = useState('');
  const [enviando, setEnviando] = useState(false);

  const fmtPct = (p) => String(p).replace('.', ',');
  // Cada item recebe o desconto da faixa correspondente à SUA quantidade (faixasDesconto vem da tabela config)
  const calc = itens.map(it => {
    const preco = num(it.produto.preco_venda);
    const bruto = preco * it.quantidade;
    const faixa = (faixasDesconto || []).find(f => it.quantidade >= num(f.min) && it.quantidade <= num(f.max));
    const pct = faixa ? num(faixa.pct) : 0;
    const desconto = Math.round(bruto * pct) / 100;
    return { ...it, preco, bruto, pct, desconto, liquido: bruto - desconto };
  });
  const comDesconto = calc.filter(l => l.pct > 0);
  const subtotal = calc.reduce((s, l) => s + l.bruto, 0);
  const descontoTotal = calc.reduce((s, l) => s + l.desconto, 0);
  const total = Math.round((subtotal - descontoTotal) * 100) / 100;

  const banner = comDesconto.length > 0 && (
    <div className="bg-green-50 border-2 border-green-400 text-green-800 rounded-xl px-3 py-2.5 mb-3 text-sm font-bold leading-snug space-y-1">
      {comDesconto.map(l => (
        <div key={l.produto.id}>
          🎉 Parabéns! Você ganhou {fmtPct(l.pct)}% de desconto por levar {l.quantidade} unidades!
          {comDesconto.length > 1 && <span className="font-medium"> ({l.produto.nome})</span>}
        </div>
      ))}
    </div>
  );
  const resumo = (
    <div className="mt-3 text-sm">
      {descontoTotal > 0 && (
        <React.Fragment>
          <div className="flex justify-between text-slate-500"><span>Subtotal</span><span>{fmtMoney(subtotal)}</span></div>
          <div className="flex justify-between text-green-600 font-semibold"><span>Desconto</span><span>-{fmtMoney(descontoTotal)}</span></div>
        </React.Fragment>
      )}
      <div className="flex justify-between items-center pt-2 mt-1 border-t border-slate-100 font-display font-extrabold text-navy text-lg"><span>Total a pagar</span><span>{fmtMoney(total)}</span></div>
    </div>
  );

  const enviarWhatsApp = async () => {
    if (!nome.trim() || !telefone.trim()) { setAviso('Preencha nome e telefone antes de enviar.'); return; }
    const numero = (whatsappLoja || '').replace(/\D/g, '');
    if (!numero) { setAviso('WhatsApp da loja não está configurado. Entre em contato diretamente.'); return; }
    setAviso(''); setEnviando(true);
    // Abre a aba já no clique (evita bloqueio de pop-up no celular) e só depois preenche o link do WhatsApp.
    const aba = window.open('', '_blank');
    const pctEfetivo = subtotal > 0 ? Math.round(descontoTotal / subtotal * 10000) / 100 : 0;
    const pedido = {
      id: 'web-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      status: 'Pendente', origem: 'catalogo',
      cliente_nome: nome.trim(), cliente_telefone: telefone.trim(), cliente_endereco: endereco.trim() || null,
      forma_pagamento: pagamento,
      itens: calc.map(l => ({ produtoId: l.produto.id, produtoNome: l.produto.nome, quantidade: l.quantidade, precoUnit: l.preco, descontoPct: l.pct, desconto: l.desconto })),
      desconto_pct: pctEfetivo, desconto_valor: descontoTotal, valor_total: total,
    };
    try {
      const { error } = await supabaseClient.from('pedidos').insert(pedido);
      if (error) throw error;
    } catch (e) {
      // Não trava o cliente: o pedido ainda segue pelo WhatsApp mesmo se o registro no banco falhar.
      console.error('Não foi possível registrar o pedido no Supabase:', e);
    }
    const linhasMsg = calc.map(l => `• ${l.produto.nome} — Qtd ${l.quantidade} — ${fmtMoney(l.bruto)}${l.pct > 0 ? ` (🏷️ -${fmtPct(l.pct)}%)` : ''}`);
    const pctsUnicos = [...new Set(comDesconto.map(l => l.pct))];
    const linhaDesconto = descontoTotal > 0 ? `\n\nSubtotal: ${fmtMoney(subtotal)}\n🏷️ Desconto${pctsUnicos.length === 1 ? ` de ${fmtPct(pctsUnicos[0])}%` : ''} aplicado: -${fmtMoney(descontoTotal)}` : '';
    const msg = `Olá! Gostaria de fazer um pedido:\n\n${linhasMsg.join('\n')}${linhaDesconto}\n\n*Total: ${fmtMoney(total)}*\n\nNome: ${nome}\nTelefone: ${telefone}\nEndereço/Retirada: ${endereco || '—'}\nPagamento: ${pagamento}`;
    const url = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
    if (aba) aba.location.href = url; else window.location.href = url;
    setEnviando(false);
    onConcluir();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center sm:justify-center">
      <div className="absolute inset-0 bg-black/50" onClick={onFechar}></div>
      <div className="relative bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl max-h-[85vh] overflow-y-auto p-5">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-display font-bold text-navy text-lg">{etapa === 'itens' ? 'Seu carrinho' : 'Finalizar pedido'}</h2>
          <button onClick={onFechar} className="text-slate-400 text-xl leading-none">&times;</button>
        </div>

        {etapa === 'itens' ? (
          <React.Fragment>
            {calc.length === 0 && <p className="text-sm text-slate-500 py-6 text-center">Seu carrinho está vazio.</p>}
            {calc.length > 0 && banner}
            {calc.map(l => (
              <div key={l.produto.id} className="flex items-center gap-3 py-2 border-b border-slate-100">
                <span className="flex-1 text-sm text-navy font-medium">
                  {l.produto.nome}
                  {l.pct > 0 && <span className="block text-xs text-green-600 font-semibold">-{fmtPct(l.pct)}% ({fmtMoney(l.desconto)})</span>}
                </span>
                <div className="flex items-center gap-2">
                  <button onClick={() => onQtd(l.produto.id, l.quantidade - 1)} className="w-7 h-7 rounded-full bg-slate-100 text-navy font-bold">−</button>
                  <span className="w-5 text-center text-sm">{l.quantidade}</span>
                  <button onClick={() => onQtd(l.produto.id, l.quantidade + 1)} className="w-7 h-7 rounded-full bg-slate-100 text-navy font-bold">+</button>
                </div>
                <span className="w-20 text-right text-sm font-semibold text-navy2">
                  {fmtMoney(l.liquido)}
                  {l.pct > 0 && <span className="block text-[10px] text-slate-400 line-through font-normal">{fmtMoney(l.bruto)}</span>}
                </span>
              </div>
            ))}
            {calc.length > 0 && (
              <React.Fragment>
                {resumo}
                <button onClick={() => setEtapa('checkout')} className="mt-4 w-full bg-navy text-white font-semibold py-3 rounded-xl">Finalizar pedido</button>
              </React.Fragment>
            )}
          </React.Fragment>
        ) : (
          <React.Fragment>
            {banner}
            {resumo}
            <div className="h-3"></div>
            <label className="block text-xs font-semibold text-navy mb-1">Nome</label>
            <input value={nome} onChange={e => setNome(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 mb-3 text-sm" />
            <label className="block text-xs font-semibold text-navy mb-1">Telefone</label>
            <input value={telefone} onChange={e => setTelefone(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 mb-3 text-sm" />
            <label className="block text-xs font-semibold text-navy mb-1">Endereço de entrega ou retirada</label>
            <input value={endereco} onChange={e => setEndereco(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 mb-3 text-sm" />
            <label className="block text-xs font-semibold text-navy mb-1">Forma de pagamento</label>
            <select value={pagamento} onChange={e => setPagamento(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 mb-3 text-sm">
              <option>Pix</option><option>Cartão</option><option>Dinheiro</option>
            </select>
            {aviso && <div className="text-xs text-red-600 mb-2">⚠️ {aviso}</div>}
            <button onClick={enviarWhatsApp} disabled={enviando} className="w-full bg-lime hover:bg-limedk disabled:opacity-60 text-navy font-bold py-3 rounded-xl mb-2">
              <i className="fa-brands fa-whatsapp mr-2"></i>{enviando ? 'Registrando pedido...' : 'Enviar Pedido via WhatsApp'}
            </button>
            <button onClick={() => setEtapa('itens')} className="w-full text-navy2 text-sm py-1">← Voltar ao carrinho</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function App() {
  const { produtos, whatsappLoja, faixasDesconto, carregando, erro } = useCatalogo();
  const [busca, setBusca] = useState('');
  const [categoria, setCategoria] = useState('Todas');
  const [carrinho, setCarrinho] = useState([]);
  const [carrinhoAberto, setCarrinhoAberto] = useState(false);

  const categorias = useMemo(() => ['Todas', ...Array.from(new Set(produtos.map(p => p.categoria).filter(Boolean)))], [produtos]);

  const filtrados = produtos.filter(p => {
    const okBusca = !busca.trim() || p.nome.toLowerCase().includes(busca.trim().toLowerCase()) || (p.categoria || '').toLowerCase().includes(busca.trim().toLowerCase());
    const okCategoria = categoria === 'Todas' || p.categoria === categoria;
    return okBusca && okCategoria;
  });

  const adicionar = (p) => setCarrinho(c => {
    const existe = c.find(it => it.produto.id === p.id);
    return existe ? c.map(it => it.produto.id === p.id ? { ...it, quantidade: it.quantidade + 1 } : it) : [...c, { produto: p, quantidade: 1 }];
  });
  const alterarQtd = (id, qtd) => setCarrinho(c => qtd <= 0 ? c.filter(it => it.produto.id !== id) : c.map(it => it.produto.id === id ? { ...it, quantidade: qtd } : it));
  const totalItens = carrinho.reduce((s, it) => s + it.quantidade, 0);

  return (
    <div className="min-h-screen bg-navy pb-24">
      <header className="sticky top-0 z-30 bg-navy/95 backdrop-blur border-b border-white/10 px-4 pt-4 pb-3">
        <div className="flex items-center justify-center mb-3">
          <img src={LOGO_SRC} alt="Inovar Store" className="h-12 object-contain" />
        </div>
        <div className="relative">
          <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input
            value={busca} onChange={e => setBusca(e.target.value)} placeholder="Buscar produto ou serviço..."
            className="w-full bg-white/10 text-white placeholder-slate-400 rounded-full pl-9 pr-4 py-2.5 text-sm outline-none focus:bg-white/15"
          />
        </div>
        <div className="flex gap-2 overflow-x-auto cat-row mt-3 pb-1">
          {categorias.map(c => (
            <button key={c} onClick={() => setCategoria(c)}
              className={`cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs font-semibold border ${categoria === c ? 'bg-lime text-navy border-lime' : 'text-white/80 border-white/20'}`}>
              {c}
            </button>
          ))}
        </div>
      </header>

      <main className="px-4 pt-4">
        {carregando && <p className="text-white/70 text-sm text-center py-10">Carregando produtos...</p>}
        {erro && <p className="text-red-300 text-sm text-center py-10">{erro}</p>}
        {!carregando && !erro && filtrados.length === 0 && <p className="text-white/70 text-sm text-center py-10">Nenhum produto encontrado.</p>}
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          {filtrados.map(p => <ProdutoCard key={p.id} p={p} onAdd={adicionar} />)}
        </div>
      </main>

      <button onClick={() => setCarrinhoAberto(true)} className="fixed bottom-5 right-5 z-40 bg-lime hover:bg-limedk text-navy w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-xl">
        <i className="fa-solid fa-cart-shopping"></i>
        {totalItens > 0 && <span className="absolute -top-1 -right-1 bg-navy text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">{totalItens}</span>}
      </button>

      {carrinhoAberto && <CarrinhoDrawer itens={carrinho} onQtd={alterarQtd} onFechar={() => setCarrinhoAberto(false)} onConcluir={() => { setCarrinho([]); setCarrinhoAberto(false); }} whatsappLoja={whatsappLoja} faixasDesconto={faixasDesconto} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
